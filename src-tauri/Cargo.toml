[package]
name = "forgepad-desktop"
version = "0.3.7"
edition = "2021"
default-run = "forgepad"

[lib]
name = "forgepad_core"

[[bin]]
name = "forgepad"
path = "src/main.rs"
required-features = ["desktop"]

[[bin]]
name = "forgepad-mcp"
path = "src/bin/forgepad-mcp.rs"

[[bin]]
name = "forgepad-service"
path = "src/bin/forgepad-service.rs"

[features]
default = ["desktop"]
desktop = ["dep:tauri", "dep:tauri-plugin-deep-link", "dep:tauri-plugin-single-instance", "dep:tauri-build"]

[dependencies]
tempfile = "3"
anyhow = "1"
axum = "0.8"
chrono-tz = "0.10"
chrono = { version = "0.4", features = ["serde"] }
fs2 = "0.4"
jsonschema = { version = "0.33", default-features = false }
keyring = { version = "3", features = ["apple-native"] }
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "multipart", "rustls-tls"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
futures-util = "0.3"
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
tauri = { version = "2", optional = true , features = [] }
tauri-plugin-deep-link = { version = "2", optional = true }
tauri-plugin-single-instance = { version = "2", features = ["deep-link"], optional = true }

[build-dependencies]
tauri-build = { version = "2", optional = true , features = [] }

[dev-dependencies]
tower = {version="0.5",features= ["util"] }
