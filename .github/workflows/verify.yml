name: Verify
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  application:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      FORGEPAD_REQUIRE_DOCKER: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Check release versions and patch notes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python scripts/release.py check ${BASE_SHA:+--base "$BASE_SHA"}
      - name: Inspect tracked files and history
        run: python scripts/check_public.py --history
      - run: python -m pip install -e '.[dev]'
      - name: Build isolated compiler image
        run: docker build -t forgepad-runner:local sandbox
      - name: Test API, persistence, interviews, and real compiler isolation
        run: python -m pytest -v
      - run: npm ci --prefix frontend
      - name: Audit frontend dependencies
        run: npm audit --prefix frontend --audit-level=high
      - name: Test React interactions
        run: npm test --prefix frontend
      - name: Build frontend
        run: npm run build --prefix frontend
      - name: Build native service for browser checks
        run: cargo build --locked --manifest-path src-tauri/Cargo.toml --no-default-features --bins
      - name: Install browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Verify browser to native service to Docker flows
        run: npm run test:e2e --prefix frontend
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: browser-failure-evidence
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 14

  native:
    runs-on: macos-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: python -m pip install -e '.[dev]'
      - run: npm ci && npm ci --prefix frontend
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --no-default-features --all-targets -- -D warnings
      - name: Test Rust persistence and transport security
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --no-default-features
      - run: cargo build --locked --manifest-path src-tauri/Cargo.toml --no-default-features --bins
      - name: Verify official MCP SDK interoperability
        run: python scripts/verify_native.py --output /tmp/native-verification.json
      - name: Build all native helpers
        run: python scripts/prepare_native.py
      - name: Build release application
        run: npx tauri build --bundles app
      - name: Import Developer ID when configured
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          if [ -n "$APPLE_CERTIFICATE" ]; then
            CERTIFICATE_PATH="$RUNNER_TEMP/forgepad-signing.p12"
            KEYCHAIN_PATH="$RUNNER_TEMP/forgepad-signing.keychain-db"
            KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
            echo "::add-mask::$KEYCHAIN_PASSWORD"
            printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$CERTIFICATE_PATH"
            security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
            security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
            security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
            security import "$CERTIFICATE_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
            security list-keychains -d user -s "$KEYCHAIN_PATH"
            security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
            rm "$CERTIFICATE_PATH"
          fi
      - name: Sign, package, and verify downloadable app
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: python scripts/package_release.py
      - uses: actions/upload-artifact@v7
        with:
          name: mac-release
          path: dist/release/
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: [application, native]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v8
        with:
          name: mac-release
          path: dist/release
      - name: Publish verified version once
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          LATEST_SHA="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)"
          if [ "$LATEST_SHA" != "$GITHUB_SHA" ]; then
            echo "A newer commit is being verified; skipping this superseded release."
            exit 0
          fi
          VERSION="$(python scripts/release.py version)"
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "Version $VERSION is already published; leaving its downloads unchanged."
          else
            gh release create "v$VERSION" --target "$GITHUB_SHA" --title "ForgePad $VERSION" --notes-file dist/release/release-notes.md dist/release/*.dmg dist/release/*.zip dist/release/SHA256SUMS.txt
          fi
