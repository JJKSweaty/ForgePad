name: Verify
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  application:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Inspect tracked files and history
        run: python scripts/check_public.py --history
      - name: Install backend
        run: python -m pip install -e '.[dev]'
      - name: Build isolated compiler image
        run: docker build -t forgepad-runner:local sandbox
      - name: Test storage, API, interviews and real compiler execution
        run: python -m pytest -v
      - name: Install frontend
        working-directory: frontend
        run: npm ci
      - name: Test frontend behavior
        working-directory: frontend
        run: npm test
      - name: Build frontend
        working-directory: frontend
        run: npm run build
