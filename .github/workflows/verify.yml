name: Verify
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  application:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Inspect tracked files and history
        run: python scripts/check_public.py --history
      - name: Install backend
        run: python -m pip install -e '.[dev]'
      - name: Build isolated compiler image
        run: docker build -t forgepad-runner:local sandbox
      - name: Test storage, API, interviews and real compiler execution
        run: python -m pytest -v
      - name: Install frontend
        working-directory: frontend
        run: npm ci
      - name: Test calendar and keyboard interactions
        working-directory: frontend
        run: npm test
      - name: Build frontend
        working-directory: frontend
        run: npm run build

  native:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: python -m pip install -e '.[dev]'
      - run: npm ci && npm ci --prefix frontend
      - name: Validate Rust core and HTTP security
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --no-default-features
      - name: Build real stdio connector and application service
        run: cargo build --locked --manifest-path src-tauri/Cargo.toml --no-default-features --bins
      - name: Verify official MCP SDK interoperability
        run: python scripts/verify_native.py
      - name: Package native worker and connector
        run: python scripts/prepare_native.py
      - name: Build macOS application
        run: npx tauri build --debug --bundles app
      - name: Seal and verify local macOS bundle
        run: python scripts/sign_local_bundle.py --bundle src-tauri/target/debug/bundle/macos/ForgePad.app
