[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "forgepad"
version = "0.1.0"
description = "Local embedded engineering practice and interview workspace"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.32,<1", "pydantic>=2.10,<3", "httpx>=0.28,<1", "python-multipart>=0.0.20,<1", "jsonschema>=4.26,<5"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1", "mcp>=1.26,<2", "pyinstaller>=6.22,<7"]

[project.scripts]
forgepad = "forgepad.cli:main"

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
markers = ["docker: requires a running Docker daemon and the ForgePad runner image"]

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.setuptools.package-data]
forgepad = ["*.json"]
